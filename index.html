<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>아신수학전문학원 TestGuide</title>
<style>
:root{--bg:#0f172a;--card:#fff;--ink:#1e293b;--muted:#64748b;--brand:#4f46e5;--brand2:#6366f1;--ok:#16a34a;--bad:#dc2626;--line:#e2e8f0;--soft:#f1f5f9;--warn:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:linear-gradient(135deg,#4f46e5,#818cf8 60%,#a5b4fc);min-height:100vh;color:var(--ink);padding:24px}
.wrap{max-width:860px;margin:0 auto}
.brandbar{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:20px}
.brandbar .logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:24px}
.brandbar h1{font-size:22px;font-weight:800}
.brandbar p{font-size:13px;opacity:.85}
.card{background:var(--card);border-radius:18px;padding:28px;box-shadow:0 20px 50px rgba(15,23,42,.25);animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:20px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:20px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border:none;padding:13px 22px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{background:var(--brand2);transform:translateY(-1px)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.ghost:hover{background:#e2e8f0}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.danger{background:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between;align-items:center}
.hide{display:none!important}
.testlist{display:grid;gap:12px;margin-top:8px}
.testitem{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:space-between;align-items:center;transition:.15s;cursor:pointer}
.testitem:hover{border-color:var(--brand);background:#f8faff}
.testitem h3{font-size:16px}
.testitem .meta{color:var(--muted);font-size:13px;margin-top:4px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.blue{background:#e0e7ff;color:var(--brand)}
.banner{background:#eef2ff;border:1.5px solid #c7d2fe;border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:14px;color:var(--brand)}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.timer{background:var(--soft);padding:8px 16px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand)}
.timer.warn{background:#fef3c7;color:var(--warn);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.progress{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-bottom:20px}
.progress>span{display:block;height:100%;background:var(--brand);transition:.3s}
.qnum{color:var(--brand);font-weight:800;font-size:13px}
.qtext{font-size:18px;font-weight:700;margin:8px 0 18px;line-height:1.5}
.qimg{width:100%;max-height:440px;object-fit:contain;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin:6px 0 18px}
.expimg{width:100%;max-height:380px;object-fit:contain;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-top:10px}
.uploader{border:2px dashed #c7d2fe;border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:#f8faff;transition:.15s;color:var(--brand);font-weight:700;font-size:14px}
.uploader:hover{background:#eef2ff;border-color:var(--brand)}
.thumb{width:100%;max-height:220px;object-fit:contain;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-top:8px}
.ansgrid{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.ansbtn{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:18px;cursor:pointer;transition:.12s;display:grid;place-items:center}
.ansbtn:hover{border-color:var(--brand2);background:#f8faff}
.ansbtn.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
.ansbtn.correct{background:var(--ok);color:#fff;border-color:var(--ok)}
.ansbtn.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.short-input{width:100%;padding:14px 16px;border:1.5px solid var(--brand);border-radius:10px;font-size:16px}
.short-ans{background:#f0fdf4;border:1.5px solid var(--ok);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:8px}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:4px;gap:4px}
.seg button{border:none;background:transparent;padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
#cropRoot .cm{position:fixed;inset:0;background:rgba(15,23,42,.88);z-index:999;display:flex;flex-direction:column;padding:16px}
#cropRoot .cm .tip{color:#fff;text-align:center;margin-bottom:8px;font-size:14px}
#cropRoot .stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
#cropRoot .cwrap{position:relative;display:inline-block;touch-action:none}
#cropRoot img{max-width:100%;display:block;-webkit-user-select:none;user-select:none}
#cropRoot .sel{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(15,23,42,.5);background:transparent;display:none}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.12s;font-size:15px}
.opt:hover{border-color:var(--brand2);background:#f8faff}
.opt.sel{border-color:var(--brand);background:#eef2ff}
.opt .mk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.opt.sel .mk{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt.correct{border-color:var(--ok);background:#f0fdf4}
.opt.correct .mk{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fef2f2}
.opt.wrong .mk{background:var(--bad);color:#fff;border-color:var(--bad)}
.navbtns{display:flex;justify-content:space-between;margin-top:24px;gap:10px}
.score-ring{width:150px;height:150px;border-radius:50%;margin:10px auto 20px;display:grid;place-items:center;background:conic-gradient(var(--brand) var(--deg,0deg),var(--soft) 0)}
.score-ring .inner{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.score-ring .inner b{font-size:34px;color:var(--brand)}
.score-ring .inner small{color:var(--muted);font-size:12px}
.stat{display:flex;gap:12px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.stat .box{background:var(--soft);border-radius:12px;padding:12px 20px;text-align:center;min-width:84px}
.stat .box b{display:block;font-size:22px}
.stat .box small{color:var(--muted);font-size:12px}
.cmp{background:var(--soft);border-radius:12px;padding:16px;margin-bottom:20px}
.cmp .bar{position:relative;height:34px;background:#e2e8f0;border-radius:8px;margin:8px 0}
.cmp .fill{position:absolute;left:0;top:0;height:100%;border-radius:8px;display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:800;font-size:13px}
.cmp .avgmark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--warn)}
.cmp .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.review-q{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.review-q .rq{font-weight:700;margin-bottom:8px}
.explain{background:#f8faff;border-left:3px solid var(--brand);border-radius:6px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.6;color:#334155}
.lecture-link{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:#eef2ff;color:var(--brand);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;transition:.15s}
.lecture-link:hover{background:#e0e7ff}
.badge{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.badge.ok{background:#dcfce7;color:var(--ok)}
.badge.no{background:#fee2e2;color:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:999px;background:var(--soft);cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.tab.active{background:var(--brand);color:#fff}
.qedit{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:#fafbff}
.qedit .opts4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:8px}
.linkbox input{border:none;background:transparent;font-size:12px;color:var(--muted);padding:4px}
.foot{text-align:center;color:#fff;opacity:.7;font-size:12px;margin-top:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.kpi{background:linear-gradient(135deg,#eef2ff,#e0e7ff);border-radius:14px;padding:16px;text-align:center}
.kpi b{display:block;font-size:26px;color:var(--brand);line-height:1.2}
.kpi small{color:var(--muted);font-size:12px}
.sectitle{font-size:15px;font-weight:800;margin:20px 0 8px;color:var(--ink)}
.bc{margin:6px 0 14px}
.bc .brow{display:flex;align-items:center;gap:10px;margin:6px 0}
.bc .bl{width:64px;font-size:12px;flex-shrink:0;color:var(--muted)}
.bc .bt{flex:1;background:var(--soft);border-radius:6px;height:24px;position:relative;overflow:hidden}
.bc .bf{position:absolute;left:0;top:0;height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-weight:700;font-size:12px}
.grouphd{font-weight:700;font-size:14px;margin:12px 0 2px}
.dist{display:flex;align-items:flex-end;gap:10px;height:170px;margin:10px 0;padding:0 6px}
.dist .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.dist .cbar{width:100%;background:linear-gradient(180deg,var(--brand2),var(--brand));border-radius:6px 6px 0 0;min-height:2px;transition:.3s}
.dist .cn{font-size:12px;font-weight:800;margin-bottom:4px;color:var(--brand)}
.dist .cl{font-size:11px;color:var(--muted);margin-top:6px;text-align:center;line-height:1.3}
.reptop{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--brand);padding-bottom:12px;margin-bottom:6px}
.reptop h2{margin-bottom:2px}
.reptop .rd{font-size:12px;color:var(--muted)}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media print{body{background:#fff!important;padding:0}.brandbar,.foot,.no-print{display:none!important}.card{box-shadow:none;border-radius:0;padding:10px}.wrap{max-width:none}.kpi{-webkit-print-color-adjust:exact;print-color-adjust:exact}.bc .bf,.dist .cbar{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.empty{text-align:center;color:var(--muted);padding:40px 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:8px;border-bottom:1px solid var(--line)}
thead tr{background:var(--soft)}
@media(max-width:600px){.qedit .opts4{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <div class="logo">📚</div>
    <div><h1>아신수학전문학원 TestGuide</h1><p>학원생 전용 평가 시스템</p></div>
    <div id="cloudStatus" style="margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#fff"></div>
  </div>
  <div id="app"></div>
  <div id="cropRoot"></div>
  <div class="foot">© Academy Online Test · 모든 기록은 이 브라우저에만 저장됩니다</div>
</div>
<script>
/* Academy Online Test v2 – cafe-link entry, explanations + lecture links, averages */
const LS_TESTS='acad_tests_v2', LS_RESULTS='acad_results_v2';
const el=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nlabel=i=>'('+(i+1)+')';
function qImgs(q){return (Array.isArray(q.imgs)&&q.imgs.length)?q.imgs:(q.img?[q.img]:[]);}
function expImgs(q){return (Array.isArray(q.explainImgs)&&q.explainImgs.length)?q.explainImgs:(q.explainImg?[q.explainImg]:[]);}
function imgsHtml(arr,cls,alt){return arr.map(function(s){return '<img class="'+cls+'" src="'+s+'" alt="'+(alt||'')+'">';}).join('');}
function correctSet(q){if(Array.isArray(q.ansMulti)&&q.ansMulti.length)return q.ansMulti.slice();return [q.ans];}
function correctLabels(q){return correctSet(q).map(nlabel).join(', ');}
function isMultiQ(q){return q.type!=='short'&&correctSet(q).length>1;}
function myAnsLabel(a){if(Array.isArray(a))return a.length?a.slice().sort((x,y)=>x-y).map(nlabel).join(', '):'(미선택)';return a>=0?nlabel(a):'(미선택)';}
function myAnsLabel2(a){if(Array.isArray(a))return a.length?a.slice().sort((x,y)=>x-y).map(nlabel).join(', '):'미응답';return a>=0?nlabel(a):'미응답';}
function sumLimitSec(t){return ((t&&t.questions)||[]).reduce((a,q)=>a+(+(q&&q.limit)||0),0);}
function testTotalSec(t){const s=sumLimitSec(t);return s>0?s:((+(t&&t.minutes)||0)*60);}
function fmtSec(s){s=Math.max(0,+s||0);const m=Math.floor(s/60),x=s%60;return x?`${m}분 ${x}초`:`${m}분`;}
function fmtTestTime(t){return fmtSec(testTotalSec(t));}

const SEED=[
 {id:'t1',title:'중등 수학 - 기초 연산',subject:'수학',minutes:10,questions:[
   {q:'12 × 8 의 값은?',opts:['84','96','108','88'],ans:1,explain:'12 × 8 = 12 × 8 = 96. 12를 8번 더하면 96입니다.',lecture:'https://www.youtube.com/results?search_query=곱셈+기초'},
   {q:'분수 1/2 + 1/4 은?',opts:['2/6','3/4','1/6','2/4'],ans:1,explain:'통분하면 2/4 + 1/4 = 3/4 입니다.',lecture:'https://www.youtube.com/results?search_query=분수+덧셈'},
   {q:'144 ÷ 12 은?',opts:['11','12','13','14'],ans:1,explain:'12 × 12 = 144 이므로 144 ÷ 12 = 12.',lecture:'https://www.youtube.com/results?search_query=나눗셈+연습'},
   {q:'직각삼각형에서 가장 긴 변을 무엇이라 하는가?',opts:['높이','밑변','빗변','직각변'],ans:2,explain:'직각의 맞은편에 있는 가장 긴 변을 빗변이라 합니다.',lecture:'https://www.youtube.com/results?search_query=직각삼각형+빗변'},
   {q:'2의 5제곱은?',opts:['16','25','32','64'],ans:2,explain:'2×2×2×2×2 = 32 입니다.',lecture:'https://www.youtube.com/results?search_query=거듭제곱+계산'},
 ]},
 {id:'t2',title:'영어 - 기초 어휘 & 문법',subject:'영어',minutes:8,questions:[
   {q:'"apple"의 뜻은?',opts:['바나나','사과','포도','오렌지'],ans:1,explain:'apple = 사과 입니다.',lecture:'https://www.youtube.com/results?search_query=기초+영단어+과일'},
   {q:'She ___ a teacher. 빈칸에 알맞은 것은?',opts:['am','is','are','be'],ans:1,explain:'3인칭 단수 주어 She에는 is를 씁니다.',lecture:'https://www.youtube.com/results?search_query=be동사+is+am+are'},
   {q:'복수형이 올바른 것은?',opts:['childs','childrens','children','childes'],ans:2,explain:'child의 불규칙 복수형은 children 입니다.',lecture:'https://www.youtube.com/results?search_query=불규칙+복수형'},
   {q:'"good"의 비교급은?',opts:['gooder','more good','better','best'],ans:2,explain:'good-better-best. 비교급은 better 입니다.',lecture:'https://www.youtube.com/results?search_query=형용사+비교급'},
   {q:'I ___ to school every day. (현재)',opts:['go','went','going','gone'],ans:0,explain:'현재 시제 일반동사는 go 입니다.',lecture:'https://www.youtube.com/results?search_query=현재시제+동사'},
 ]},
 {id:'t3',title:'과학 - 생활 과학',subject:'과학',minutes:8,questions:[
   {q:'물이 끓는 온도는?',opts:['50℃','80℃','100℃','120℃'],ans:2,explain:'1기압에서 물은 100℃에서 끓습니다.',lecture:'https://www.youtube.com/results?search_query=물의+끓는점'},
   {q:'지구에서 가장 가까운 별은?',opts:['달','태양','화성','금성'],ans:1,explain:'별(항성) 중 가장 가까운 것은 태양입니다. 달은 위성입니다.',lecture:'https://www.youtube.com/results?search_query=태양계+별'},
   {q:'식물이 햇빛으로 영양분을 만드는 과정은?',opts:['호흡','증산','광합성','소화'],ans:2,explain:'식물이 빛을 이용해 양분을 만드는 것을 광합성이라 합니다.',lecture:'https://www.youtube.com/results?search_query=광합성+원리'},
 ]},
];

function loadTests(){try{const d=JSON.parse(localStorage.getItem(LS_TESTS));return d&&d.length?d:SEED;}catch(e){return SEED;}}
function saveTests(t){localStorage.setItem(LS_TESTS,JSON.stringify(t));cloudSaveTests(t);}
const LS_LECTURES='acad_lectures_v1';
function loadLectures(){try{return JSON.parse(localStorage.getItem(LS_LECTURES))||[];}catch(e){return[];}}
function saveLectures(l){localStorage.setItem(LS_LECTURES,JSON.stringify(l));cloudSaveLectures(l);}
function loadResults(){try{return JSON.parse(localStorage.getItem(LS_RESULTS))||[];}catch(e){return[];}}
function saveResults(r){localStorage.setItem(LS_RESULTS,JSON.stringify(r));}
const LS_STUDENTS='acad_students_v2';
const GRADES=['초5','초6','중1','중2','중3','고1','고2','고3'];
function gradeOptions(sel){return '<option value="">'+(sel?'':'학년 선택')+'</option>'+GRADES.map(function(g){return '<option value="'+g+'"'+(sel===g?' selected':'')+'>'+g+'</option>';}).join('');}
function getStudents(){try{return JSON.parse(localStorage.getItem(LS_STUDENTS))||{};}catch(e){return{};}}
function saveStudents(m){localStorage.setItem(LS_STUDENTS,JSON.stringify(m));}
function findStudent(sid){return getStudents()[sid]||null;}
function hasSubmitted(tid){return loadResults().some(r=>r.testId===tid&&student&&r.sid===student.id&&r.student===student.name);}
const LS_TRASH='acad_trash_v1';
function getTrash(){try{return JSON.parse(localStorage.getItem(LS_TRASH))||[];}catch(e){return[];}}
function saveTrash(t){localStorage.setItem(LS_TRASH,JSON.stringify(t));}
const LS_STU_TRASH='acad_stu_trash_v1';
function getStuTrash(){try{return JSON.parse(localStorage.getItem(LS_STU_TRASH))||[];}catch(e){return[];}}
function saveStuTrash(t){localStorage.setItem(LS_STU_TRASH,JSON.stringify(t));}

let student=null, tests=loadTests();
let curTest=null, curIdx=0, answers=[], timerID=null, timeLeft=0, qRemain=[], qLocked=[], reviewMode=false, wrongList=[], lastCorrect=false, lastTimedOut=false, curMode='learning', cfg=null, retryAns=null, retryOK=false;
let adminTab='list', editData=null, entryTestId=null, selectedStudentIdxs=[];
const LS_ADMINPW='acad_adminpw_v2';
let adminAuthed=false;
const LS_ADMINSESS='acad_adminsess_v1';
function setAdminSess(on){try{if(on)localStorage.setItem(LS_ADMINSESS,'1');else localStorage.removeItem(LS_ADMINSESS);}catch(e){}}
function hasAdminSess(){try{return localStorage.getItem(LS_ADMINSESS)==='1';}catch(e){return false;}}
let loginTime=0;
const LS_USAGE='acad_usage_v2';
function usageKey(s){return (s?s.sid:'')+'|'+(s?s.name:'');}
function getUsageStore(){try{return JSON.parse(localStorage.getItem(LS_USAGE))||{};}catch(e){return{};}}
function usageEntry(key){const raw=getUsageStore()[key];if(raw==null)return{sec:0,log:[],first:'',last:''};if(typeof raw==='number')return{sec:raw,log:[],first:'',last:''};return{sec:raw.sec||0,log:Array.isArray(raw.log)?raw.log:[],first:raw.first||'',last:raw.last||''};}
function storedUsage(s){return usageEntry(usageKey(s)).sec;}
function commitUsage(){if(!student||!loginTime)return;const sec=sessionElapsed();if(sec<=0){loginTime=Date.now();return;}const m=getUsageStore();const e=usageEntry(usageKey(student));const now=new Date().toLocaleString('ko-KR');e.sec+=sec;e.log.push({d:now,sec});if(e.log.length>300)e.log=e.log.slice(-300);if(!e.first)e.first=now;e.last=now;m[usageKey(student)]=e;localStorage.setItem(LS_USAGE,JSON.stringify(m));cloudSaveUsage(usageKey(student),e);loginTime=Date.now();}
function cumulativeUsage(s){return storedUsage(s)+(s&&student&&usageKey(s)===usageKey(student)?sessionElapsed():0);}
function adminStudents(){const all=loadResults();const map={};all.forEach(r=>{const k=(r.sid||'-')+'|'+(r.student||'');(map[k]=map[k]||{key:k,name:r.student||'',sid:r.sid||'-',rs:[]}).rs.push(r);});const store=getUsageStore();Object.keys(store).forEach(k=>{if(!map[k]){const p=k.split('|');map[k]={key:k,name:p[1]||'',sid:p[0]||'-',rs:[]};}});return Object.keys(map).sort().map(k=>map[k]);}
function sessionElapsed(){return loginTime?Math.floor((Date.now()-loginTime)/1000):0;}
function fmtDur(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+'시간 ':'')+(h||m?m+'분 ':'')+s+'초';}
function hashPw(s){let h=5381;for(let i=0;i<s.length;i++){h=(((h<<5)+h)+s.charCodeAt(i))&0xffffffff;}return String(h>>>0);}
function getPw(){return localStorage.getItem(LS_ADMINPW);}
function setPw(p){localStorage.setItem(LS_ADMINPW,hashPw(p));}

/* ============ CLOUD SYNC (Firebase Firestore) ============ */
let CLOUD=null, cloudOn=false, curView='login';
function sanId(s){let x=encodeURIComponent(String(s));x=x.replace(/[.#$\[\]\/*]/g,'_');return x||'_';}
function newRid(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function cloudSaveTests(list){if(!cloudOn)return;try{(list||[]).forEach(function(t){if(t&&t.id)CLOUD.setDoc(CLOUD.doc(CLOUD.db,'tests',sanId(t.id)),t).catch(function(){});});}catch(e){}}
function cloudSaveTest(t){if(!cloudOn||!t||!t.id)return;try{CLOUD.setDoc(CLOUD.doc(CLOUD.db,'tests',sanId(t.id)),t).catch(function(){});}catch(e){}}
function cloudDelTest(id){if(!cloudOn||!id)return;try{CLOUD.deleteDoc(CLOUD.doc(CLOUD.db,'tests',sanId(id))).catch(function(){});}catch(e){}}
function cloudSaveLectures(list){if(!cloudOn)return;try{CLOUD.setDoc(CLOUD.doc(CLOUD.db,'config','lectures'),{data:list}).catch(function(){});}catch(e){}}
function cloudSaveStudent(s){if(!cloudOn||!s||!s.sid)return;try{CLOUD.setDoc(CLOUD.doc(CLOUD.db,'students',sanId(s.sid)),{sid:s.sid,name:s.name||'',pw:s.pw||'',grade:s.grade||''}).catch(function(){});}catch(e){}}
function cloudDelStudent(sid){if(!cloudOn)return;try{CLOUD.deleteDoc(CLOUD.doc(CLOUD.db,'students',sanId(sid))).catch(function(){});}catch(e){}}
function cloudSaveResult(r){if(!cloudOn||!r||!r.rid)return;try{CLOUD.setDoc(CLOUD.doc(CLOUD.db,'results',r.rid),r).catch(function(){});}catch(e){}}
function cloudDelResult(rid){if(!cloudOn||!rid)return;try{CLOUD.deleteDoc(CLOUD.doc(CLOUD.db,'results',rid)).catch(function(){});}catch(e){}}
function cloudSaveUsage(key,entry){if(!cloudOn)return;try{CLOUD.setDoc(CLOUD.doc(CLOUD.db,'usage',sanId(key)),{key:key,entry:entry}).catch(function(){});}catch(e){}}
function cloudDelUsage(key){if(!cloudOn)return;try{CLOUD.deleteDoc(CLOUD.doc(CLOUD.db,'usage',sanId(key))).catch(function(){});}catch(e){}}
function refreshView(){try{if(curView==='login')viewLogin();else if(curView==='home'){if(student)viewHome();}else if(curView==='tests'){if(student)viewTests();}else if(curView==='lectures'){if(student)viewLectures();}else if(curView==='results'){if(student)viewMyResults();}else if(curView==='admin'){if(adminAuthed)renderAdmin();}}catch(e){}}
function applyTestsSnap(list){localStorage.setItem(LS_TESTS,JSON.stringify(list&&list.length?list:SEED));tests=loadTests();refreshView();}
function applyLecturesSnap(list){localStorage.setItem(LS_LECTURES,JSON.stringify(list||[]));refreshView();}
function applyStudentsSnap(map){localStorage.setItem(LS_STUDENTS,JSON.stringify(map));refreshView();}
function applyResultsSnap(arr){localStorage.setItem(LS_RESULTS,JSON.stringify(arr));refreshView();}
function applyUsageSnap(map){localStorage.setItem(LS_USAGE,JSON.stringify(map));refreshView();}

function getParam(k){
  const h=(location.hash||'').replace(/^#/,'');
  const hp=new URLSearchParams(h).get(k);
  if(hp)return hp;
  return new URLSearchParams(location.search).get(k);
}
function buildLink(tid){
  const base=location.href.split('#')[0].split('?')[0];
  return base+'#test='+tid;
}

window.doLogin=function(){
  const n=document.getElementById('nm').value.trim(),i=document.getElementById('sid').value.trim(),p=document.getElementById('pw').value;
  if(!n||!i){alert('이름과 학생 번호를 모두 입력해 주세요.');return;}
  const rec=findStudent(i);
  if(!rec||rec.name!==n){alert('등록되지 않은 수강생입니다.\n관리자에게 등록을 요청하세요. (이름과 학생 번호가 등록된 값과 정확히 일치해야 합니다.)');return;}
  if(!rec.pw){
    if(!p||p.length<4){alert('첫 로그인입니다. 앞으로 사용할 개인 암호를 4자 이상으로 입력하세요.');return;}
    const m=getStudents();m[i].pw=hashPw(p);saveStudents(m);cloudSaveStudent(m[i]);
    alert('개인 암호가 설정되었습니다. 앞으로는 이 암호로 로그인하세요.');
  }else{
    if(hashPw(p)!==rec.pw){alert('개인 암호가 올바르지 않습니다.');return;}
  }
  student={name:n,id:i,sid:i,grade:(rec.grade||'')};
  loginTime=Date.now();
  if(entryTestId){const t=loadTests().find(x=>x.id===entryTestId);if(t){startTest(entryTestId);return;}}
  viewHome();
};
window.logout=function(){
  if(loginTime){const total=sessionElapsed();commitUsage();alert('본 세션 이용시간: '+fmtDur(total)+'\n누적 이용시간: '+fmtDur(storedUsage(student)));}
  loginTime=0;student=null;viewLogin();
};

/* ============ TEST TAKING ============ */
window.startTest=function(tid){
  curView='test';
  tests=loadTests();
  curTest=tests.find(t=>t.id===tid);
  if(!curTest){alert('시험을 찾을 수 없습니다.');return;}
  curMode=curTest.mode||'learning';
  cfg=modeCfg(curTest);
  const prev=loadResults();
  const doneIdx=prev.findIndex(r=>r.testId===tid&&r.sid===student.id&&r.student===student.name);
  if(doneIdx>=0){
    alert('이미 응시한 시험입니다. 답안은 한 번만 제출할 수 있어요.\n재시험이 필요하면 관리자(선생님)에게 문의하세요. 관리자가 판단하여 재응시 여부를 결정합니다.\n지금은 문제와 해설을 다시 확인합니다.');
    renderResult(prev[doneIdx],doneIdx);
    return;
  }
  if(cfg.guide){renderGuide(tid);return;}
  startTestGo();
};
function renderGuide(tid){
  const t=curTest, cf=cfg, m=curMode;
  const rules=[];
  if(cf.immediate){rules.push('문항마다 답을 <b>제출하면 바로 채점</b>됩니다.');}
  if(cf.explain){rules.push('틀리거나 제한시간이 지나면 <b>해설·강의</b>를 보여드리며, <b>정답을 다시 입력</b>해야 합니다. 정답을 제출한 뒤 <b>“이해했어요”</b>를 눌러야 다음 단계로 진행됩니다.');}
  if(cf.perQLimit){rules.push('문항별로 <b>제한시간</b>이 있을 수 있으며, 시간이 지나면 해당 문항이 처리됩니다.');}
  if(cf.freeNav){rules.push('문항을 <b>자유롭게 오가며</b> 풀 수 있습니다.');}else if(cf.immediate){rules.push('문항은 <b>순서대로</b> 진행되며 이전 문항으로 돌아갈 수 없습니다.');}
  if(cf.totalTime){rules.push('전체 제한시간 <b>'+fmtTestTime(t)+'</b>이 지나면 시험이 <b>자동 종료·제출</b>됩니다. 종료 <b>1분 전</b> 예고 안내가 표시됩니다.');}
  if(cf.totalTime&&!cf.earlyClose){rules.push('전체 시간이 지나기 전에는 <b>조기에 종료할 수 없습니다.</b>');}
  if(cf.earlyClose){rules.push('원하면 <b>먼저 제출</b>할 수 있습니다.');}
  rules.push('성적은 <b>처음 선택·입력한 답안</b>을 기초로 작성됩니다.');
  rules.push('답안은 <b>한 번만 제출</b>할 수 있습니다.');
  el.innerHTML=`<div class="card">
    <h2>📋 시험 안내</h2>
    <p class="sub">${esc(t.title)} · ${t.questions.length}문항 · 제한시간 ${fmtTestTime(t)} · <b style="color:var(--brand)">${modeLabel(m)}</b></p>
    <div class="banner">아래 진행 방식을 읽고 숭지한 뒤 시작하세요.</div>
    <ul style="line-height:1.9;padding-left:20px;margin:10px 0">${rules.map(r=>'<li>'+r+'</li>').join('')}</ul>
    <label class="row" style="gap:8px;align-items:center;margin-top:8px;cursor:pointer"><input type="checkbox" id="ackchk" onchange="document.getElementById('startbtn').disabled=!this.checked"> <span>위 내용을 모두 숙지했습니다.</span></label>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="startbtn" disabled onclick="startTestGo()">시험 시작 →</button>
      <button class="btn ghost" onclick="viewHome()">취소</button>
    </div>
  </div>`;
}
window.startTestGo=function(){
  curIdx=0; answers=curTest.questions.map(q=>q.type==='short'?'':-1);
  qRemain=curTest.questions.map(q=>{const l=+(q.limit||0);return (cfg.perQLimit&&l>0)?l:0;});
  qLocked=curTest.questions.map(()=>false);
  wrongList=[];
  timeLeft=testTotalSec(curTest);
  reviewMode=false;
  renderQuestion();
  startGlobalTimer();
};
function startGlobalTimer(){
  stopTimer();
  timerID=setInterval(()=>{
    if(reviewMode)return;
    timeLeft--;
    const te=document.getElementById('tm');
    if(te){te.textContent=fmtTime(timeLeft);te.className='timer'+(timeLeft<=30?' warn':'');}
    if(cfg&&cfg.totalTime){
      const ew=document.getElementById('endwarn');
      if(ew){
        if(timeLeft<=60&&timeLeft>0){ew.style.display='block';ew.textContent='⚠️ 시험 종료까지 '+fmtTime(timeLeft)+' 남았습니다 — 시간이 지나면 자동으로 제출됩니다.';}
        else{ew.style.display='none';}
      }
    }
    if(cfg&&cfg.perQLimit){
      const q=curTest.questions[curIdx];
      if((+q.limit||0)>0 && !qLocked[curIdx]){
        qRemain[curIdx]--;
        const qe=document.getElementById('qtm');
        if(qe){qe.textContent='⏳ '+fmtTime(Math.max(0,qRemain[curIdx]));qe.className='timer'+(qRemain[curIdx]<=10?' warn':'');}
        if(qRemain[curIdx]<=0){qLocked[curIdx]=true;if(cfg.immediate)submitAnswer(true);else onClassicTimeout();}
      }
    }
    if(cfg&&cfg.totalTime&&timeLeft<=0){stopTimer();submitTest();}
  },1000);
}
function onClassicTimeout(){
  const qe=document.getElementById('qtm');
  if(qe){qe.textContent='⏰ 시간 초과';qe.className='timer warn';}
  renderQuestion();
}
window.submitAnswer=function(timedOut){
  if(reviewMode)return;
  const q=curTest.questions[curIdx];
  if(!timedOut && unanswered(q,answers[curIdx])){alert('답을 입력(선택)한 뒤 제출하세요.');return;}
  qLocked[curIdx]=true;
  reviewMode=true;
  const correct=!unanswered(q,answers[curIdx]) && isCorrect(q,answers[curIdx]);
  if(!correct && wrongList.indexOf(curIdx)<0) wrongList.push(curIdx);
  lastCorrect=correct; lastTimedOut=!!timedOut;
  retryAns=(q.type==='short')?'':(isMultiQ(q)?[]:-1); retryOK=false;
  renderFeedback();
};
function renderFeedback(){
  const q=curTest.questions[curIdx], total=curTest.questions.length;
  const isLast=curIdx===total-1;
  const content=qImgs(q).length?imgsHtml(qImgs(q),'qimg','문제'):`<div class="qtext">${esc(q.q||'')}</div>`;
  let ansLine;
  if(q.type==='short')ansLine=`<div class="short-ans">정답: <b>${esc(q.ansText||'')}</b></div>`;

/* ============ MY RESULTS + AVERAGES ============ */
window.viewMyResults=function(){
  curView='results';
  stopTimer();
  const all=loadResults();
  const mine=all.filter(r=>r.sid===student.id&&r.student===student.name);
  let head='';
  if(mine.length){
    const myAvg=Math.round(mine.reduce((a,b)=>a+b.score,0)/mine.length);
    const best=Math.max(...mine.map(r=>r.score));
    head=`<div class="stat">
      <div class="box"><b style="color:var(--brand)">${myAvg}</b><small>내 평균</small></div>
      <div class="box"><b style="color:var(--ok)">${best}</b><small>최고점</small></div>
      <div class="box"><b>${mine.length}</b><small>응시 횟수</small></div>
    </div>`;
  }
  const rows=mine.slice().reverse().map(r=>{
    const st=statsFor(r.testId);
    const idx=all.indexOf(r);
    const diff=r.score-st.avg;
    const dtxt=diff>0?`<span style="color:var(--ok)">+${diff}</span>`:diff<0?`<span style="color:var(--bad)">${diff}</span>`:'0';
    const wn=wrongNums(r);const wtxt=(wn&&wn.length)?`<b style="color:var(--bad)">${wn.join(', ')}</b>`:'<span style="color:var(--ok)">없음</span>';
    return `<tr>
      <td>${esc(r.testTitle)}</td>
      <td style="text-align:center"><b style="color:${r.score>=70?'var(--ok)':'var(--bad)'}">${r.score}점</b></td>
      <td style="text-align:center">${st.avg}점</td>
      <td style="text-align:center">${dtxt}</td>
      <td style="text-align:center">${r.correct}/${r.total}</td>
      <td style="text-align:center;font-size:12px">${wtxt}</td>
      <td style="text-align:center"><button class="btn ghost sm" onclick="viewReview('${r.testId}',${idx})">해설</button></td>
    </tr>`;
  }).join('');
  el.innerHTML=`<div class="card">
    <h2>📊 내 성적 · 평균</h2>
    <p class="sub">${esc(student.name)} (${esc(student.id)}) · ⏱ 세션 <b id="sessClock">${fmtDur(sessionElapsed())}</b> · 누적 <b id="cumClock">${fmtDur(cumulativeUsage(student))}</b></p>
    ${head}
    ${mine.length?`<table><thead><tr><th style="text-align:left">시험</th><th>내점수</th><th>평균</th><th>편차</th><th>정답률</th><th>틀린문항</th><th>해설</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">아직 응시 기록이 없어요.</div>'}
    <div class="row" style="margin-top:18px">
      <button class="btn" onclick="showInfographic('me')">📊 성적 인포그래픽(PDF)</button>
      ${entryTestId?'<button class="btn ghost" onclick="logout()">마침하기</button>':'<button class="btn ghost" onclick="viewHome()">🏠 홈으로</button>'}
    </div>
  </div>`;
};

/* ---- Cropper ---- */
let crop={kind:null,idx:0,drag:false,sx:0,sy:0,rect:null};
function openCropper(kind,idx,dataURL){
  crop={kind,idx,drag:false,sx:0,sy:0,rect:null};
  const root=document.getElementById('cropRoot');
  root.innerHTML=`<div class="cm">
    <div class="tip">📐 이미지에서 원하는 문제 영역을 <b>드래그</b>로 선택하세요</div>
    <div class="stage"><div class="cwrap" id="cwrap"><img id="cimg" draggable="false"><div class="sel" id="csel"></div></div></div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="btn" onclick="applyCrop()">✂️ 선택 영역 자르기</button>
      <button class="btn ghost" onclick="applyWhole()">전체 이미지 사용</button>
      <button class="btn ghost" onclick="closeCrop()">취소</button>
    </div></div>`;
  const img=document.getElementById('cimg');
  img.onload=()=>bindCropEvents();
  img.src=dataURL;
}
function bindCropEvents(){
  const wrap=document.getElementById('cwrap'), sel=document.getElementById('csel'), img=document.getElementById('cimg');
  const pos=e=>{const r=img.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return{x:Math.max(0,Math.min(cx,img.clientWidth)),y:Math.max(0,Math.min(cy,img.clientHeight))};};
  const down=e=>{e.preventDefault();const p=pos(e);crop.drag=true;crop.sx=p.x;crop.sy=p.y;sel.style.display='block';sel.style.left=p.x+'px';sel.style.top=p.y+'px';sel.style.width='0px';sel.style.height='0px';crop.rect=null;};
  const move=e=>{if(!crop.drag)return;e.preventDefault();const p=pos(e);const x=Math.min(p.x,crop.sx),y=Math.min(p.y,crop.sy),w=Math.abs(p.x-crop.sx),h=Math.abs(p.y-crop.sy);sel.style.left=x+'px';sel.style.top=y+'px';sel.style.width=w+'px';sel.style.height=h+'px';crop.rect={x,y,w,h};};
  const up=()=>{crop.drag=false;};
  wrap.onmousedown=down;window.onmousemove=move;window.onmouseup=up;
  wrap.ontouchstart=down;wrap.ontouchmove=move;wrap.ontouchend=up;
}
function cropToDataURL(){
  const img=document.getElementById('cimg');
  const scale=img.naturalWidth/img.clientWidth;
  let r=crop.rect;
  if(!r||r.w<8||r.h<8)return null;
  const sx=r.x*scale, sy=r.y*scale, sw=r.w*scale, sh=r.h*scale;
  const outW=Math.min(sw,1000), k=outW/sw;
  const cv=document.createElement('canvas');cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
  cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',0.8);
}
function wholeToDataURL(){
  const img=document.getElementById('cimg');
  const k=Math.min(1,1000/img.naturalWidth);
  const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',0.8);
}
function assignCrop(d){if(!d)return;const q=editData.questions[crop.idx];if(crop.kind==='q'){q.imgs=qImgs(q);q.imgs.push(d);q.img='';}else{q.explainImgs=expImgs(q);q.explainImgs.push(d);q.explainImg='';}closeCrop();renderEdit();}
window.applyCrop=function(){const d=cropToDataURL();if(!d){alert('먼저 자를 영역을 드래그로 선택하세요.');return;}assignCrop(d);};
window.applyWhole=function(){assignCrop(wholeToDataURL());};
window.closeCrop=function(){window.onmousemove=null;window.onmouseup=null;document.getElementById('cropRoot').innerHTML='';};

    return `<div class="qedit">
      <div class="row between"><b>문항 ${i+1}</b><button class="btn ghost sm" onclick="rmQ(${i})">🗑</button></div>

      ${typeSeg}
      ${ansBox}
      <label>해설 (텍스트, 선택)</label><textarea rows="2" oninput="editData.questions[${i}].explain=this.value">${esc(q.explain||'')}</textarea>

      <label>강의 링크 (URL, 선택)</label><input placeholder="https://..." value="${esc(q.lecture||'')}" oninput="editData.questions[${i}].lecture=this.value">
    </div>`;
  }).join('');
  el.innerHTML=`<div class="card">
    <h2>${editData.title?'✏️ 시험 수정':'➕ 새 시험'}</h2>
    <div class="banner">💡 문제/해설 이미지를 불러온 뒤 <b>여러 문제 중 원하는 부분을 박스로 드래그</b>하면 그 영역만 잘라서 올라갑니다. 정답은 5지선다형 또는 단답형으로 입력합니다.</div>
    <label>시험 제목</label><input value="${esc(editData.title)}" oninput="editData.title=this.value">
    <label>과목</label><input value="${esc(editData.subject)}" oninput="editData.subject=this.value">
    <label>대상 학년 <span style="color:var(--muted);font-size:12px">— 지정하면 해당 학년 학생에게만 표시됩니다(미지정=전체 공통)</span></label><select onchange="editData.grade=this.value" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px">${gradeOptions(editData.grade||'')}</select>
    <label>전체 제한시간(분) <span style="color:var(--muted);font-size:12px">— 문항별 제한시간이 없을 때 사용</span></label><input type="number" min="1" value="${editData.minutes}" oninput="editData.minutes=+this.value">
    <div class="banner" style="background:#eef6ff;border-color:#b3d4fc;font-size:13px;margin-top:6px">⏱️ 문항별 제한시간 합계: <b id="autoTotal">${fmtSec(sumLimitSec(editData))}</b><span id="autoTotalNote">${sumLimitSec(editData)>0?' · 합계가 있으므로 전체 시험 시간은 이 값으로 자동 적용됩니다.':' · 합계가 0이면 위 전체 제한시간이 사용됩니다.'}</span></div>
    <label>시험 방식</label>
    <select onchange="editData.mode=this.value;renderEdit()" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px">
      <option value="learning" ${editData.mode==='learning'?'selected':''}>학습형 — 문항별 제출·즉시 채점, 오답시 해설·강의 후 정답재입력·이해확인</option>
      <option value="classic" ${editData.mode==='classic'?'selected':''}>기본형 — 문항 자유 이동 + 문항별 제한시간 + 최종 제출</option>
      <option value="timed" ${editData.mode==='timed'?'selected':''}>시간형 — 자유 이동·총 시험시간 자동 제출(종료 1분 전 예고, 조기종료 불가)</option>
      <option value="custom" ${editData.mode==='custom'?'selected':''}>선택형 — 관리자가 요소를 직접 조합</option>
    </select>
    <div class="banner" style="font-size:12px">${editData.mode==='timed'?'⏱️ 시간형은 위 <b>제한 시간(분)</b>이 전체 시험 시간이며, 문항을 자유롭게 오갈 수 있습니다. 종료 1분 전 예고가 뜨고, 전체 시간이 지나면 자동 제출되며 조기 종료는 할 수 없습니다.':(editData.mode==='classic'?'🗂️ 기본형은 문항을 자유롭게 오가며 풀고, 문항별 제한시간이 지나면 해당 문항이 잠깁니다.':(editData.mode==='custom'?'🧩 선택형은 아래 요소를 자유롭게 조합해 시험을 구성합니다.':'🎓 학습형은 문항마다 제출·채점하며 틀리거나 시간 초과 시 해설·강의를 보여준 뒤 정답을 다시 입력하고 이해해야 다음으로 진행합니다.'))}</div>
    ${editData.mode==='custom'?customToggles():''}
    <div class="row between" style="margin-top:22px;align-items:center"><h2 style="margin:0">문항 목록 (총 ${editData.questions.length}문항)</h2><button class="btn sm" onclick="addQ()">➕ 문항 추가</button></div>${qs}
    <button class="btn ghost" style="margin-top:10px" onclick="addQ()">➕ 문항 추가</button>
    <div class="row" style="margin-top:20px"><button class="btn" onclick="saveEdit()">💾 저장</button><button class="btn ghost" onclick="adminTab='list';renderAdmin()">취소</button></div>
  </div>`;
}
window.addQ=function(){editData.questions.push(blankQ());renderEdit();setTimeout(function(){try{const cards=document.querySelectorAll('.qedit');const last=cards[cards.length-1];if(last){last.scrollIntoView({behavior:'smooth',block:'center'});last.style.transition='box-shadow .3s';last.style.boxShadow='0 0 0 3px var(--brand)';setTimeout(function(){last.style.boxShadow='';},1200);}}catch(e){}},60);};
window.setQLimit=function(i,unit,val){
  const q=editData.questions[i];const cur=+q.limit||0;
  let m=Math.floor(cur/60),s=cur%60;
  const v=Math.max(0,parseInt(val,10)||0);
  if(unit==='m')m=v;else s=Math.min(59,v);
  q.limit=m*60+s;
  const at=document.getElementById('autoTotal');if(at)at.textContent=fmtSec(sumLimitSec(editData));
  const nt=document.getElementById('autoTotalNote');if(nt)nt.textContent=sumLimitSec(editData)>0?' · 합계가 있으므로 전체 시험 시간은 이 값으로 자동 적용됩니다.':' · 합계가 0이면 위 전체 제한시간이 사용됩니다.';
};
window.rmQ=function(i){if(editData.questions.length<=1){alert('최소 1문항 필요');return;}editData.questions.splice(i,1);renderEdit();};
window.saveEdit=function(){
  const t=editData; t.title=(t.title||'').trim(); t.subject=(t.subject||'').trim(); if(!t.mode)t.mode='learning';
  if(!t.title){alert('시험 제목을 입력하세요.');return;}
  for(let k=0;k<t.questions.length;k++){const q=t.questions[k];
    if(q.opts){if(!q.q||!q.q.trim()){alert(`${k+1}번 문제가 비어있어요.`);return;}}
    else if(!qImgs(q).length){alert(`${k+1}번 문제 이미지를 올려주세요.`);return;}
    if((q.type==='short')&&(!q.ansText||!q.ansText.trim())){alert(`${k+1}번 단답형 정답을 입력해주세요.`);return;}
  }
  const list=loadTests(); const idx=list.findIndex(x=>x.id===t.id);
  if(idx>=0)list[idx]=t;else list.push(t);
  try{saveTests(list);}catch(e){alert('저장 용량을 초과했어요. 이미지 수를 줄이거나 크기를 줄여주세요.');return;}
  adminTab='list'; renderAdmin();
};

/* ============ INFOGRAPHIC (PDF) ============ */
function infoBar(label,val,color){
  const w=Math.max(2,Math.min(100,val));
  return `<div class="brow"><span class="bl">${esc(label)}</span><div class="bt"><div class="bf" style="width:${w}%;background:${color}">${val}점</div></div></div>`;
}
function studentBlock(s){
  const rs=s.rs.slice();
  const entry=usageEntry(s.key);
  const live=(student&&usageKey(student)===s.key)?sessionElapsed():0;
  const cum=entry.sec+live;
  const scores=rs.map(r=>r.score);
  const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;
  const best=scores.length?Math.max(...scores):0, worst=scores.length?Math.min(...scores):0;
  const byTest={};rs.forEach(r=>{byTest[r.testId]=r;});
  const bars=Object.keys(byTest).map(tid=>{const r=byTest[tid];const st=statsFor(tid);return `<div class="grouphd">${esc(r.testTitle)}</div><div class="bc">${infoBar('학생 점수',r.score,'var(--brand)')}${infoBar('학급 평균',st.avg,'var(--warn)')}</div>`;}).join('');
  const examRows=rs.slice().reverse().map(r=>{const wn=wrongNums(r);const wtxt=(wn&&wn.length)?`<b style="color:var(--bad)">${wn.join(', ')}</b>`:'<span style="color:var(--ok)">없음</span>';return `<tr><td>${esc(r.testTitle)}</td><td style="text-align:center"><b style="color:${r.score>=70?'var(--ok)':'var(--bad)'}">${r.score}점</b></td><td style="text-align:center">${r.correct}/${r.total}</td><td style="text-align:center;font-size:12px">${wtxt}</td><td style="text-align:center">${fmtTime(r.timeUsed||0)}</td><td style="font-size:12px">${esc(r.date)}</td></tr>`;}).join('');
  const logRows=entry.log.slice().reverse().map(l=>`<tr><td style="font-size:12px">${esc(l.d)}</td><td style="text-align:right">${fmtDur(l.sec)}</td></tr>`).join('');
  const liveRow=live?`<tr><td style="font-size:12px;color:var(--brand)">현재 접속 세션</td><td style="text-align:right;color:var(--brand)">${fmtDur(live)}</td></tr>`:'';
  return `<div style="border:1px solid var(--line,#e5e7eb);border-radius:12px;padding:14px;margin:14px 0;background:rgba(0,0,0,.015)">
    <div class="grouphd" style="font-size:16px;margin-top:0">👤 ${esc(s.name)} <span style="color:var(--muted);font-weight:400">(${esc(s.sid)})</span></div>
    <div class="kpis">
      <div class="kpi"><b>${avg}</b><small>평균</small></div>
      <div class="kpi"><b>${best}</b><small>최고</small></div>
      <div class="kpi"><b>${worst}</b><small>최저</small></div>
      <div class="kpi"><b>${rs.length}</b><small>응시 횟수</small></div>
      <div class="kpi"><b style="font-size:15px">${fmtDur(cum)}</b><small>누적 이용시간</small></div>
    </div>
    <div style="font-size:12px;color:var(--muted);margin:6px 0 4px">최초 사용: ${esc(entry.first||'-')} · 최근 사용: ${esc(entry.last||'-')}${live?' · <b style="color:var(--brand)">현재 접속 중</b>':''}</div>
    ${bars?`<div class="sectitle">📈 시험별 점수 vs 학급 평균</div>${bars}`:''}
    ${rs.length?`<div class="sectitle">📅 응시 이력</div><table><thead><tr><th style="text-align:left">시험</th><th>점수</th><th>정답률</th><th>틀린문항</th><th>소요</th><th style="text-align:left">응시일시</th></tr></thead><tbody>${examRows}</tbody></table>`:''}
    <div class="sectitle">⏱ 이용시간 상세 (세션별 사용일시)</div>
    ${(logRows||liveRow)?`<table><thead><tr><th style="text-align:left">사용일시</th><th style="text-align:right">이용시간</th></tr></thead><tbody>${liveRow}${logRows}</tbody></table>`:'<div style="font-size:13px;color:var(--muted)">기록된 세션 이용시간이 없습니다.</div>'}
  </div>`;
}
window.showInfographic=function(scope,arg){
  stopTimer();
  const all=loadResults();
  const now=new Date().toLocaleString('ko-KR');
  let title, kpis, charts;
  if(scope==='me'){
    const mine=all.filter(r=>r.sid===student.id&&r.student===student.name);
    if(!mine.length){alert('응시 기록이 없어요.');return;}
    const avg=Math.round(mine.reduce((a,b)=>a+b.score,0)/mine.length);
    const best=Math.max(...mine.map(r=>r.score)), worst=Math.min(...mine.map(r=>r.score));
    title=`${esc(student.name)} 님 성적 리포트`;
    kpis=`<div class="kpis">
      <div class="kpi"><b>${avg}</b><small>내 평균</small></div>
      <div class="kpi"><b>${best}</b><small>최고점</small></div>
      <div class="kpi"><b>${worst}</b><small>최저점</small></div>
      <div class="kpi"><b>${mine.length}</b><small>응시 횟수</small></div>
    </div>`;
    const byTest={};mine.forEach(r=>{byTest[r.testId]=r;});
    const groups=Object.keys(byTest).map(tid=>{const r=byTest[tid];const st=statsFor(tid);
      return `<div class="grouphd">${esc(r.testTitle)}</div><div class="bc">${infoBar('내 점수',r.score,'var(--brand)')}${infoBar('학급 평균',st.avg,'var(--warn)')}</div>`;}).join('');
    const usageBlock=`<div class="sectitle">⏱ 학습 이용시간</div><div class="kpis" style="grid-template-columns:repeat(2,1fr)"><div class="kpi"><b style="font-size:20px" id="sessClock">${fmtDur(sessionElapsed())}</b><small>본 세션 이용시간</small></div><div class="kpi"><b style="font-size:20px" id="cumClock">${fmtDur(cumulativeUsage(student))}</b><small>누적 이용시간</small></div></div>`;
    charts=`${usageBlock}<div class="sectitle">📈 시험별 내 점수 vs 학급 평균</div>${groups}`;
  }else if(scope==='stu'){
    const studs=adminStudents();
    const s=studs[arg];
    if(!s){alert('학생을 찾을 수 없어요.');return;}
    title=`${esc(s.name)} 개인 리포트`;
    kpis='';
    charts=studentBlock(s);
  }else if(scope==='sel'){
    const studs=adminStudents();
    const sel=selectedStudentIdxs.map(i=>studs[i]).filter(Boolean);
    if(!sel.length){alert('선택된 학생이 없어요.');return;}
    title='선택 학생 성적 · 이용시간 리포트';
    const allScores=[];sel.forEach(s=>s.rs.forEach(r=>allScores.push(r.score)));
    const avg=allScores.length?Math.round(allScores.reduce((a,b)=>a+b,0)/allScores.length):0;
    let totalSec=0;sel.forEach(s=>{const e=usageEntry(s.key);totalSec+=e.sec+((student&&usageKey(student)===s.key)?sessionElapsed():0);});
    kpis=`<div class="kpis">
      <div class="kpi"><b>${sel.length}</b><small>선택 학생</small></div>
      <div class="kpi"><b>${allScores.length}</b><small>총 응시</small></div>
      <div class="kpi"><b>${avg}</b><small>평균</small></div>
      <div class="kpi"><b style="font-size:15px">${fmtDur(totalSec)}</b><small>누적시간</small></div>
    </div>`;
    charts=`<div class="sectitle">👥 선택 학생 개인별 리포트</div>${sel.map(studentBlock).join('')}`;
  }else{
    const studs=adminStudents();
    if(!studs.length){alert('응시 또는 이용 기록이 없어요.');return;}
    title='전체 성적 · 개인별 리포트';
    const scored=all.length;
    const avg=scored?Math.round(all.reduce((a,b)=>a+b.score,0)/all.length):0;
    let totalSec=0;studs.forEach(s=>{const e=usageEntry(s.key);totalSec+=e.sec+((student&&usageKey(student)===s.key)?sessionElapsed():0);});
    kpis=`<div class="kpis">
      <div class="kpi"><b>${studs.length}</b><small>학생 수</small></div>
      <div class="kpi"><b>${scored}</b><small>총 응시</small></div>
      <div class="kpi"><b>${avg}</b><small>전체 평균</small></div>
      <div class="kpi"><b style="font-size:15px">${fmtDur(totalSec)}</b><small>총 누적시간</small></div>
    </div>`;
    charts=`<div class="sectitle">👥 개인별 성적 · 이용시간 리포트</div>${studs.map(studentBlock).join('')}`;
  }
  el.innerHTML=`<div class="card">
    <div class="reptop">
      <div><h2>${title}</h2><div class="rd">아신수학전문학원 온라인 테스트</div></div>
      <div class="rd" style="text-align:right">생성: ${now}${scope==='me'?'<br>⏱ 이용시간 '+fmtDur(sessionElapsed()):''}</div>
    </div>
    ${kpis}
    ${charts}
    <div class="row no-print" style="margin-top:22px">
      <button class="btn" onclick="window.print()">🖨️ PDF로 저장 / 인쇄</button>
      <button class="btn ghost" onclick="${scope==='me'?'viewMyResults()':'renderAdmin()'}">← 돌아가기</button>
    </div>
  </div>`;
};

window.__bootApp=function(){
  if(window.__booted)return; window.__booted=true;
  try{renderCloudStatus();}catch(e){}
  const tid=getParam('test');
  if(tid&&loadTests().find(t=>t.id===tid)){entryTestId=tid;}
  setInterval(()=>{const e=document.getElementById('sessClock');if(e&&loginTime)e.textContent=fmtDur(sessionElapsed());const c=document.getElementById('cumClock');if(c&&student)c.textContent=fmtDur(cumulativeUsage(student));},1000);
  window.addEventListener('beforeunload',commitUsage);
  window.addEventListener('hashchange',()=>{
    const t=getParam('test');
    if(t&&loadTests().find(x=>x.id===t)&&!student){entryTestId=t;viewLogin();}
  });
  if(!entryTestId&&hasAdminSess()&&getPw()){adminAuthed=true;viewAdmin();}
  else viewLogin();
};

function renderCloudStatus(){
  var el=document.getElementById('cloudStatus');if(!el)return;
  if(cloudOn){
    el.innerHTML='<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block"></span>\uD074\uB77C\uC6B0\uB4DC \uC5F0\uACB0\uB428</span><button id="cloudReloadBtn" style="background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer">\uD83D\uDD04 \uC0C8\uB85C\uACE0\uCE68</button>';
  }else{
    el.innerHTML='<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block"></span>\uB85C\uCEEC \uBAA8\uB4DC(\uBBF8\uB3D9\uAE30\uD654)</span>';
  }
  var b=document.getElementById('cloudReloadBtn');if(b)b.onclick=function(){window.reloadFromCloud();};
}
async function cloudPull(){
  if(!cloudOn||!CLOUD)return false;
  var db=CLOUD.db,doc=CLOUD.doc,collection=CLOUD.collection,getDocs=CLOUD.getDocs,getDoc=CLOUD.getDoc;
  try{
    const tSnap=await getDocs(collection(db,'tests'));
    if(!tSnap.empty){const arr=[];tSnap.forEach(d=>arr.push(d.data()));arr.sort((a,b)=>String(a.id||'').localeCompare(String(b.id||'')));localStorage.setItem(LS_TESTS,JSON.stringify(arr));}
    else{let migrated=false;try{const old=await getDoc(doc(db,'config','tests'));if(old.exists()&&old.data().data&&old.data().data.length){const arr=old.data().data;localStorage.setItem(LS_TESTS,JSON.stringify(arr));arr.forEach(t=>cloudSaveTest(t));migrated=true;}}catch(e){}if(!migrated){const loc=loadTests();loc.forEach(t=>cloudSaveTest(t));}}
    const lSnap=await getDoc(doc(db,'config','lectures'));
    if(lSnap.exists()&&lSnap.data().data){localStorage.setItem(LS_LECTURES,JSON.stringify(lSnap.data().data));}
    else{cloudSaveLectures(loadLectures());}
    const sSnap=await getDocs(collection(db,'students'));
    if(!sSnap.empty){const m={};sSnap.forEach(d=>{const v=d.data();if(v.sid)m[v.sid]=v;});localStorage.setItem(LS_STUDENTS,JSON.stringify(m));}
    else{const loc=getStudents();Object.keys(loc).forEach(k=>cloudSaveStudent(loc[k]));}
    const rSnap=await getDocs(collection(db,'results'));
    if(!rSnap.empty){const arr=[];rSnap.forEach(d=>arr.push(d.data()));arr.sort((a,b)=>(a.date||'').localeCompare(b.date||''));localStorage.setItem(LS_RESULTS,JSON.stringify(arr));}
    else{const loc=loadResults();loc.forEach(r=>{if(!r.rid)r.rid=newRid();cloudSaveResult(r);});saveResults(loc);}
    const uSnap=await getDocs(collection(db,'usage'));
    if(!uSnap.empty){const m={};uSnap.forEach(d=>{const v=d.data();if(v.key)m[v.key]=v.entry;});localStorage.setItem(LS_USAGE,JSON.stringify(m));}
    else{const loc=getUsageStore();Object.keys(loc).forEach(k=>cloudSaveUsage(k,loc[k]));}
    return true;
  }catch(e){console.warn('cloud pull',e);return false;}
}
window.reloadFromCloud=async function(){
  var b=document.getElementById('cloudReloadBtn');if(b){b.disabled=true;b.textContent='\u2026';}
  const ok=await cloudPull();
  if(ok){tests=loadTests();refreshView();}
  renderCloudStatus();
  if(!ok)alert('\uD074\uB77C\uC6B0\uB4DC\uC5D0\uC11C \uBD88\uB7EC\uC624\uC9C0 \uBABB\uD588\uC5B4\uC694. \uC7A0\uC2DC \uD6C4 \uB2E4\uC2DC \uC2DC\uB3C4\uD574\uC8FC\uC138\uC694.');
};
window.__cloudReady=async function(fs){
  CLOUD=fs; cloudOn=true;
  await cloudPull();
  renderCloudStatus();
  var db=CLOUD.db,doc=CLOUD.doc,collection=CLOUD.collection,onSnapshot=CLOUD.onSnapshot;
  try{
    onSnapshot(collection(db,'tests'),qs=>{const arr=[];qs.forEach(d=>arr.push(d.data()));arr.sort((a,b)=>String(a.id||'').localeCompare(String(b.id||'')));applyTestsSnap(arr);});
    onSnapshot(doc(db,'config','lectures'),d=>{if(d.exists()&&d.data().data)applyLecturesSnap(d.data().data);});
    onSnapshot(collection(db,'students'),qs=>{const m={};qs.forEach(d=>{const v=d.data();if(v.sid)m[v.sid]=v;});applyStudentsSnap(m);});
    onSnapshot(collection(db,'results'),qs=>{const arr=[];qs.forEach(d=>arr.push(d.data()));arr.sort((a,b)=>(a.date||'').localeCompare(b.date||''));applyResultsSnap(arr);});
    onSnapshot(collection(db,'usage'),qs=>{const m={};qs.forEach(d=>{const v=d.data();if(v.key)m[v.key]=v.entry;});applyUsageSnap(m);});
  }catch(e){console.warn('cloud listen',e);}
  window.__bootApp();
};

setTimeout(()=>{if(!window.__booted)window.__bootApp();},5000);

</script>
